schema_version: 1
component:
  id: advices
  name: Advices
  layer: ORGANIZATION
  artifact_type: governance-proposal
  problem: Define how decentralized technical peer-review groups could contribute informed, contestable review to Drayker proposals without becoming permanent authorities.
  scope:
    - Public proposal for the future role of councils.
    - Public description of councils as decentralized technical peer review under DFMP.
    - Public separation between reasoned review and permanent bureaucratic authority.
    - Open questions about formation, participation and recorded positions.
  non_scope:
    - Active councils with binding authority.
    - A required approval gate during the founding phase.
  dependencies:
    - dfmp
    - daf
  implementation:
    level: none
    scope: The repository describes the council concept; formation and operating procedures remain undefined.
    evidence:
      - type: document
        ref: README.md
  risks:
    - Readers may mistake a proposed council system for a current institution.
    - Undefined membership and decision rules can create false legitimacy.
    - Competence criteria could become an unreviewable caste unless positions and procedures remain inspectable and contestable.
  contributions:
    availability: open
    entrypoint: https://github.com/draykerdk/advices/issues
  source_of_truth:
    repository: https://github.com/draykerdk/advices
    path: README.md
  last_reviewed: "2026-09-03"
