schema_version: 1
component:
  id: advices
  name: Advices
  layer: ORGANIZATION
  artifact_type: governance-proposal
  problem: Define how member councils, formed for each question, examine contested decisions, vetoes, reputation disputes and algorithms, and how their conclusions reach the revision of decisions.
  scope:
    - Member councils convened by members for one question, with the conveners taking part.
    - Composition by Dknowledge from members' links to the question (the best informed and the most affected), with Dk taking part in the deliberation.
    - Means of independence (authorized access to preserved records, independent technical support, operator substitution and verification of compliance).
    - Formalization of the justified contextual veto over decisions that directly affect the member's life and context.
  non_scope:
    - Wealth-weighted or tokenized decisions.
    - Standing councils with fixed categories or seats.
    - Councils whose composition criteria and conclusions cannot be examined; records open according to permission level, and sealed details stay sealed.
    - Automatic vetoes over routine operational workflows during the founding phase.
  dependencies:
    - dfmp
    - daf
  implementation:
    level: none
    scope: The repository describes member councils formed for each question and the means that keep their examination independent. Convening, composition and recording protocols remain in development.
    evidence:
      - type: document
        ref: README.md
  risks:
    - Readers may mistake a proposed council structure for automatic execution by the veto chain.
    - If the criteria Dknowledge uses to compose a council are opaque, a council could be packed; the criteria must stay examinable.
  contributions:
    availability: open
    entrypoint: https://github.com/draykerdk/advices/issues
  source_of_truth:
    repository: https://github.com/draykerdk/advices
    path: README.md
  last_reviewed: "2026-10-19"
