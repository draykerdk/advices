# The Drayker documentation theme — one layout shared by every *.drayker.org site.
# Source: https://github.com/draykerdk/drayker-theme
remote_theme: draykerdk/drayker-theme

# Set explicitly: GitHub Pages derives site.url without TLS when the certificate is
# terminated upstream, which leaves absolute URLs in meta tags on http. Everything the
# sitemap and the social cards emit has to be the canonical https address.
url: "https://advices.drayker.org"

plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter
  - jekyll-sitemap

title: "Advices"
description: "A question examined by the people who know it best and the people it affects most. Advices develops the member councils of Drayker, formed for each question, with Dk in the middle."

dk_kicker: "Councils"
dk_subdomain: "advices.drayker.org"
dk_repo: "https://github.com/draykerdk/advices"

defaults:
  - scope:
      path: ""
    values:
      layout: default

dk_sphere: "ice"  # cold light: a proposal read by people who can judge it

# The official mark, recoloured. Geometry is fixed for every project
# (DRAYKER-MARK.md §2.5); only the globe carries the scope.
dk_accent: "#D98CD1"  # councils: considered violet-rose, deliberation not machinery
